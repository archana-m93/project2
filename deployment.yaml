apiVersion: apps/v1
kind: Deployment

metadata:
  name: project2-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: project2

  template:
    metadata:
      labels:
        app: project2

    spec:
      containers:
        - name: project2-container
          image: archanamr/project2:v2
          ports:
            - containerPort: 80
